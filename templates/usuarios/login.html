{% extends 'base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
    <h1>Iniciar sesión</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Crear una cuenta</a></p>
{% endblock %}
